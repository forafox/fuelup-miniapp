spring:
  application:
    name: fuelup-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fuelup}
    username: ${SPRING_DATASOURCE_USERNAME:fuelup}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/001-init-schema.xml

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD}
      timeout: 2000ms

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

fuelup:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  internal:
    api-key: ${INTERNAL_API_KEY}
  partner:
    api-url: ${PARTNER_API_URL}
    api-key: ${PARTNER_API_KEY}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000

logging:
  level:
    ru.fuelup: INFO
    org.springframework.security: WARN
